name: Publish to npm (GitHub Packages)

on:
  push:
    tags:
      - 'v*'
    branches:
      - dev
      - main

jobs:
  publish:
    runs-on: [self-hosted, gh-runner-01]
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build packages
        run: bun turbo build

      - name: Publish to GitHub Packages
        run: |
          bun config set //npm.pkg.github.com/:_authToken ${{ secrets.GITHUB_TOKEN }}
          bun publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
